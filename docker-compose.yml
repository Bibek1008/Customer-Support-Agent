# Local stack: Postgres+pgvector for the KB and tickets, a Llama Guard 4 model
# server for the safety guardrail, an OpenTelemetry collector, and Langfuse as
# the trace backend. Every service reads secrets from the environment; nothing
# is hardcoded here beyond local-dev defaults you are expected to override.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted safety classifier. vLLM serves Llama Guard 4 12B with an
  # OpenAI-compatible API. On a 24 GB card run it quantized (FP8/INT8); on a
  # 48 GB card it fits in BF16 with headroom (see FACTS.md Section 4).
  guardrail:
    image: vllm/vllm-openai:latest
    command: >
      --model meta-llama/Llama-Guard-4-12B
      --port 8001
      --max-model-len 8192
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8001:8001"
    # Uncomment on a GPU host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP

  langfuse:
    image: langfuse/langfuse:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@db:5432/${POSTGRES_DB:-support}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-prod}
      SALT: ${LANGFUSE_SALT:-change-me-in-prod}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@db:5432/${POSTGRES_DB:-support}
      SAFETY_MODEL_URL: http://guardrail:8001/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"

volumes:
  pgdata:
