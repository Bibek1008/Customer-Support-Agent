[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "A customer-support agent safe to put in front of real users: tool use over a knowledge base and ticketing, guardrails on every step, confidence-based human handoff, and an offline eval suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vizuara AI Labs" }]

dependencies = [
    "anthropic>=0.116",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# The spaCy model Presidio needs for its default NER recognizers. Installed
# separately because it is a model download, not a PyPI dependency graph.
pii = ["spacy>=3.7"]
# Local (self-hosted) embedding option instead of the hosted default.
local-embed = ["FlagEmbedding>=1.3", "torch>=2.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
