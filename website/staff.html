<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support Desk · Staff Inbox</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#26313c;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:0 22px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:28px}a{color:#6845c5}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#6845c5;color:white;border:0;border-radius:8px;padding:10px 15px}button:disabled{opacity:.5}input,textarea,select{padding:10px;border:1px solid #d7dce4;border-radius:8px;max-width:100%}#login{background:white;border:1px solid #e0e3ea;border-radius:14px;padding:24px;max-width:560px;margin-top:30px}#login input{width:100%;margin-bottom:14px}.muted{color:#6e7885;font-size:13px}#error{color:#a62f3c;white-space:pre-wrap}#list{display:grid;gap:18px}.ticket{background:white;border:1px solid #e0e3ea;border-radius:14px;padding:24px}.ticket h2{font-size:17px;margin:0}.ticket pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f6fa;padding:18px;border-radius:8px;font:13px/1.6 ui-monospace,monospace}.ticket textarea{width:100%;min-height:90px}.actions{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}#toolbar{display:flex;gap:12px;margin:20px 0}#evals{white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;background:#fff;padding:20px;border-radius:12px}label{display:block;margin:8px 0} [hidden]{display:none!important}
</style></head><body><main>
<header><div><h1>Staff inbox</h1><p class="muted">Review escalations, reply to customers, and update ticket status.</p></div><a href="/">Customer chat ↗</a></header>
<form id="login"><label for="key">Staff access key</label><input id="key" type="password" autocomplete="off" required placeholder="Enter your staff access key"><button>Unlock inbox</button><p class="muted">The key stays in this tab’s memory and is cleared when you sign out or close the page.</p></form>
<p id="error" role="alert"></p><div id="toolbar" hidden><button id="refresh">Refresh tickets</button><button id="evaluations">View evaluations</button><button id="activity">Recent activity & guardrails</button><button id="logout">Sign out</button></div><div id="list" aria-live="polite"></div><pre id="evals" hidden></pre>
</main><script>
let staffKey = '';
const list = document.querySelector('#list'); const error = document.querySelector('#error');
async function api(url, options = {}) {
  const response = await fetch(url, {...options, headers:{'Authorization':'Bearer ' + staffKey, 'Content-Type':'application/json', ...options.headers}});
  const data = await response.json(); if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Request failed'); return data;
}
function node(tag, text, className) { const n = document.createElement(tag); if (text) n.textContent = text; if (className) n.className = className; return n; }
async function load() {
  error.textContent = ''; const tickets = await api('/api/admin/tickets'); list.replaceChildren();
  if (!tickets.length) list.append(node('p', 'No support tickets yet.'));
  for (const ticket of tickets) {
    const card = node('article', '', 'ticket'); card.append(node('h2', ticket.subject),node('p', ticket.id + ' · ' + ticket.status + ' · ' + new Date(ticket.created_at).toLocaleString(),'muted'),node('pre',ticket.body));
    if (ticket.messages?.length) { const details=node('details');details.append(node('summary','Full saved conversation'),node('pre',ticket.messages.map(m=>m.role+': '+m.content).join('\n\n')));card.append(details); }
    if (ticket.replies?.length) card.append(node('pre','Previous staff replies:\n\n'+ticket.replies.join('\n\n')));
    const reply = node('textarea'); reply.placeholder = 'Write a reply to the customer…'; reply.setAttribute('aria-label','Reply for ' + ticket.id); card.append(reply);
    const actions = node('div','','actions'); const send = node('button','Send reply'); const status = node('select'); status.setAttribute('aria-label','Status for ' + ticket.id);
    for (const value of ['open','escalated','resolved']) { const option = node('option',value); option.value = value; option.selected = ticket.status === value; status.append(option); }
    const save = node('button','Update status'); const result = node('span','','muted');
    send.addEventListener('click',async()=>{if(!reply.value.trim()) return; send.disabled=true;try{await api('/api/admin/tickets/'+encodeURIComponent(ticket.id)+'/replies',{method:'POST',body:JSON.stringify({message:reply.value})});reply.value='';result.textContent='Reply saved. The customer can see it in their chat.';}catch(e){error.textContent=e.message;}finally{send.disabled=false;}});
    save.addEventListener('click',async()=>{save.disabled=true;try{await api('/api/admin/tickets/'+encodeURIComponent(ticket.id),{method:'PATCH',body:JSON.stringify({status:status.value})});result.textContent='Status saved.';}catch(e){error.textContent=e.message;}finally{save.disabled=false;}});
    actions.append(send,status,save,result);card.append(actions);list.append(card);
  }
}
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();staffKey=document.querySelector('#key').value;document.querySelector('#key').value='';try{await load();document.querySelector('#login').hidden=true;document.querySelector('#toolbar').hidden=false;}catch(e){staffKey='';error.textContent=e.message;}});
document.querySelector('#refresh').addEventListener('click',()=>load().catch(e=>error.textContent=e.message));
document.querySelector('#evaluations').addEventListener('click',async()=>{try{const data=await api('/api/admin/evaluations');const el=document.querySelector('#evals');el.hidden=false;el.textContent=data.length?JSON.stringify(data,null,2):'No evaluation runs recorded.';}catch(e){error.textContent=e.message;}});
document.querySelector('#activity').addEventListener('click',async()=>{try{const data=await api('/api/admin/activity');const el=document.querySelector('#evals');el.hidden=false;el.textContent=data.length?JSON.stringify(data,null,2):'No chat requests recorded.';}catch(e){error.textContent=e.message;}});
document.querySelector('#logout').addEventListener('click',()=>{staffKey='';list.replaceChildren();document.querySelector('#evals').hidden=true;document.querySelector('#evals').textContent='';document.querySelector('#login').hidden=false;document.querySelector('#toolbar').hidden=true;error.textContent='';});
</script></body></html>
